<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnosa</title>
</head>
<body style="font:14px monospace;padding:10px;white-space:pre-wrap">
<div id="o">Memeriksa...</div>
<script>
const o = document.getElementById('o');
o.textContent = '';
const P = t => o.textContent += t + '\n';
(async () => {
  for (const f of ['app1.js', 'app2.js', 'app3.js']) {
    try {
      const r = await fetch(f + '?x=' + Date.now());
      const t = await r.text();
      let s = 'OK';
      try { new Function(t); } catch (e) { s = 'SYNTAX: ' + e.message; }
      P(f + ' | status ' + r.status + ' | ' + r.headers.get('content-type') + ' | ' + t.length + ' karakter | ' + s);
      P('  awal: ' + JSON.stringify(t.slice(0, 50)));
      P('  akhir: ' + JSON.stringify(t.slice(-40)));
    } catch (e) {
      P(f + ' GAGAL: ' + e.message);
    }
  }
})();
</script>
</body>
</html>
