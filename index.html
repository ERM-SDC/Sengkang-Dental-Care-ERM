<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERM Sengkang Dental Care</title>
<link rel="stylesheet" href="style.css">
<style>
.trow{display:flex;gap:8px;margin-top:8px}
.trow .tn{flex:2;min-width:0}
.trow .tb{flex:1;min-width:0}
.tot{font-weight:700;margin-top:10px}
.st{font-size:.8rem;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
</style>
</head>
<body>
<div id="vLogin" class="card" style="max-width:380px;margin-top:10vh">
  <h1>ERM Sengkang Dental Care</h1>
  <small style="color:var(--mut)">Masuk dengan akun Anda</small>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
  <div style="margin-top:16px"><button id="btnLogin" style="width:100%">Masuk</button></div>
  <div id="loginErr" class="err"></div>
</div>
<div id="vApp" class="hide">
  <div class="bar">
    <div><strong id="uNama"></strong><br><small id="uRole" style="color:var(--mut)"></small></div>
    <button class="alt" id="btnOut">Keluar</button>
  </div>
  <div class="nav" id="nav">
    <span class="on" data-tab="pasien">Pasien</span><span data-tab="daftar">Pendaftaran</span><span>Rekam Medis</span><span>Kasir</span>
  </div>
  <div id="vPasien">
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="q" placeholder="Cari nama, nomor RM, NIK, atau HP" style="flex:1;min-width:200px">
        <button id="btnNew">+ Pasien baru</button>
      </div>
      <div id="list" style="margin-top:10px"></div>
    </div>
    <div id="formCard" class="card hide">
      <h2>Pasien baru</h2>
      <div id="form" class="grid"></div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="btnSave">Simpan</button><button class="alt" id="btnCancel">Batal</button>
      </div>
      <div id="formMsg"></div>
    </div>
  </div>
  <div id="vDaftar" class="hide"></div>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div style="margin-top:14px"><button class="alt" id="dlgClose">Tutup</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
<script src="app6.js"></script>
<script src="app7.js"></script>
<script src="app3.js"></script>
</body>
                   </html>
