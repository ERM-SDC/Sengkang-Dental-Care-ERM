<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnosa 2</title>
</head>
<body style="font:13px monospace;padding:8px;white-space:pre-wrap">
<div id="o"></div>
<script>
var o = document.getElementById('o');
var errLine = 0;
function P(t) { o.textContent += t + '\n'; }
window.addEventListener('error', function (e) {
  errLine = e.lineno;
  P('ERROR: ' + e.message + ' | baris ' + e.lineno + ' kolom ' + e.colno);
});
fetch('app1.js?x=' + Date.now())
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var L = t.split('\n');
    P('baris: ' + L.length + ' | karakter: ' + t.length);
    var s = document.createElement('script');
    s.textContent = 'var supabase={createClient:function(){return {}}};' + t;
    document.body.appendChild(s);
    setTimeout(function () {
      if (!errLine) P('Tidak ada error sintaks.');
      P('----- isi app1.js -----');
      for (var i = 0; i < L.length; i++) {
        P((i + 1 === errLine ? '>> ' : '   ') + (i + 1) + ': ' + L[i]);
      }
    }, 300);
  });
</script>
</body>
</html>
